<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .notification {
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            display: none; /* Hidden by default */
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

    <div class="notification success" id="successNotification">{{ notification }}</div>
    <div class="notification error" id="errorNotification">There was an error submitting the form.</div>

    <script>
        function showNotification(type) {
            const successNotification = document.getElementById('successNotification');
            const errorNotification = document.getElementById('errorNotification');

            if (type === 'success') {
                successNotification.style.display = 'block';
                setTimeout(() => {
                    successNotification.style.display = 'none';
                }, 3000);
            } else if (type === 'error') {
                errorNotification.style.display = 'block';
                setTimeout(() => {
                    errorNotification.style.display = 'none';
                }, 3000);
            }
        }

        // Call this function on successful form submission
        showNotification('success');
    </script>

</body>
</html>
