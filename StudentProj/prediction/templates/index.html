<form method="POST" onsubmit="handleSubmit(event)">
    {% csrf_token %}
    <label>Name:</label> <input type="text" name="name" required>
    <label>Age:</label> <input type="number" name="age" required>
    <label>Study Hours:</label> <input type="number" name="study_hours" required>
    <label>Previous Scores:</label> <input type="number" name="previous_scores" required>
    <button type="submit">Predict</button>
</form>
<div class="notification success" id="successNotification">Form submitted successfully!</div>
<div class="notification error" id="errorNotification">There was an error submitting the form.</div>
<script>
    function handleSubmit(event) {
        event.preventDefault();
        const formData = new FormData(event.target);
        fetch('/predict/', {
            method: 'POST',
            body: JSON.stringify({
                name: formData.get('name'),
                age: formData.get('age'),
                study_hours: formData.get('study_hours'),
                previous_scores: formData.get('previous_scores')
            }),
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken') // Ensure CSRF token is sent
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.message) {
                showNotification('success');
            } else {
                showNotification('error');
            }
        })
        .catch(error => {
            showNotification('error');
        });
    }
</script>
